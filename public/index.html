<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Junk">
  <title>Junk Drawer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <form id="add" autocomplete="off">
      <label for="text" class="label">JUNK DRAWER</label>
      <textarea id="text" rows="1" placeholder="throw it in…" enterkeyhint="send" autofocus spellcheck="true"></textarea>
      <p class="hint">enter = save · shift+enter = new line · "t:" forces todo · "n:" forces note</p>
    </form>

    <section id="login" hidden>
      <form id="login-form">
        <label for="pass" class="label">PASSCODE</label>
        <input id="pass" type="password" enterkeyhint="go" autocomplete="current-password">
      </form>
    </section>

    <nav id="filters">
      <button data-f="all" class="on">ALL</button>
      <button data-f="todo">TODO</button>
      <button data-f="note">NOTES</button>
      <button data-f="done">DONE</button>
      <input id="find" type="search" placeholder="find" enterkeyhint="search">
    </nav>

    <div id="status" role="status"></div>
    <div id="drawer"></div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
